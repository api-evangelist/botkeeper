aid: botkeeper
name: Botkeeper
description: >-
  Botkeeper is an AI-powered accounting automation platform built specifically for
  accounting firms. Founded in 2015 and headquartered in Boston, the company's
  Botkeeper Infinite product combines machine learning with optional skilled
  accountants to automate bookkeeping at practice scale: Smart Connect pulls
  read-only bank and credit-card transactions and statements from thousands of
  financial institutions, Transaction Manager and Auto Bank Rec categorize and
  reconcile them against QuickBooks Online, QuickBooks Desktop and Xero, and
  Documents, Work, Close Tracker, JE Automation and Firm Insights carry the
  surrounding practice workflow. Botkeeper operates APIs — its own status page
  lists a User API, a Bookkeeping API and a Tasks API — and ships a first-party
  Zapier app, but it publishes no developer portal, no API reference and no
  machine-readable specification of any kind.
