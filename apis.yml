apis:
- name: Botkeeper Platform API
  description: >-
    Botkeeper's partner platform API. The company does not publish a reference,
    a portal or a specification for it; the only public evidence of its shape is
    Botkeeper's own status page, which lists three first-party components under
    "Application Programming Interface (APIs)" — User API, Bookkeeping API and
    Tasks API — and the first-party Zapier app, which exposes eight operations
    across clients, tasks, users and documents. The production host is an AWS API
    Gateway that answers every unauthenticated request with
    {"message":"Missing Authentication Token"}; authentication is Amazon Cognito
    OIDC. Recorded here from probed evidence only.
  humanURL: https://status.botkeeper.com/
  baseURL: https://ipa.botkeeper.com
  tags:
  - Accounting
  - Bookkeeping
  - Tasks
  - Users
  properties:
  - type: Authentication
    url: authentication/botkeeper-authentication.yml
  - type: OAuthScopes
    url: scopes/botkeeper-scopes.yml
  x-evidence:
    fetched: '2026-08-08'
    probes:
    - url: https://ipa.botkeeper.com/
      status: 403
      body: '{"message":"Missing Authentication Token"}'
    - url: https://status.botkeeper.com/api/v2/components.json
      status: 200
    - url: https://zapier.com/apps/botkeeper/integrations
      status: 200
    - url: https://api.botkeeper.com/
      status: 0
      note: dangling CNAME to a retired Elastic Beanstalk environment; does not resolve
